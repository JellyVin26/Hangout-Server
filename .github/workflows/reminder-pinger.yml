name: Reminder Pinger
on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Fire reminder scheduler
        run: |
          curl -sS -m 30 -o /dev/null -w "HTTP %{http_code}\n" \
            "https://hangout-server-neon.vercel.app/notifications/reminders/run?secret=${{ secrets.CRON_SECRET }}"
        env:
          CRON_SECRET_PLACEHOLDER: ${{ secrets.CRON_SECRET }}
